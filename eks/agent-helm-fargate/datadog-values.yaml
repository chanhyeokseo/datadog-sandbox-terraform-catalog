datadog:
  site: "datadoghq.com"
  clusterName: "your-cluster-name-here"
  apiKeyExistingSecret: "datadog-secret"
  clusterChecks:
    enabled: true
  orchestratorExplorer:
    enabled: true

agents:
  enabled: false

clusterAgent:
  enabled: true
  tokenExistingSecret: "datadog-secret"
  admissionController:
    agentSidecarInjection:
      enabled: true
      provider: fargate
