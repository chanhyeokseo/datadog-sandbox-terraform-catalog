name: Docker publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Semver without v prefix (e.g. 1.3.1)
        required: true
        type: string
      push_latest:
        description: Also push latest tag
        required: false
        type: boolean
        default: true

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUSH_LATEST: ${{ github.event.inputs.push_latest }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
            echo "PUSH_LATEST=$INPUT_PUSH_LATEST" >> "$GITHUB_ENV"
          else
            echo "VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"
            echo "PUSH_LATEST=true" >> "$GITHUB_ENV"
          fi

      - name: Build and push tfrunner
        run: |
          set -eu
          tags=( -t "dogstac/dogstac:${VERSION}" )
          if [ "${PUSH_LATEST}" = "true" ]; then
            tags+=( -t "dogstac/dogstac:latest" )
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            "${tags[@]}" \
            -f webui/backend/Dockerfile \
            --push \
            .

