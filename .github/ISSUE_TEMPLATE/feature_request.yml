name: Feature request
description: Suggest an idea or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share context so we can understand the goal and constraints.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What limitation or pain point does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change in behavior or UX?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: UI, backend API, Terraform catalog, docs, or other — and AWS/Terraform impact if any.
    validations:
      required: false
