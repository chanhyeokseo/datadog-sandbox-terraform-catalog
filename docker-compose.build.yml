services:
  backend:
    build:
      context: .
      dockerfile: webui/backend/Dockerfile
    image: dogstac/tfrunner:latest
    container_name: dogstac-backend
    ports:
      - "${TFRUNNER_PORT:-7621}:${TFRUNNER_PORT:-7621}"
      - "${MCP_PORT:-7622}:${MCP_PORT:-7622}"
    environment:
      - TERRAFORM_DIR=/app/terraform
      - USE_PARAMETER_STORE=true
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_PROFILE=${AWS_PROFILE:-}
      - DOGSTAC_SALT=${DOGSTAC_SALT:-}
      - FORCE_REINIT=${FORCE_REINIT:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_MCP=${ENABLE_MCP:-true}
      - TFRUNNER_PORT=${TFRUNNER_PORT:-7621}
      - MCP_PORT=${MCP_PORT:-7622}
    volumes:
      - ${TERRAFORM_DATA_PATH:-./terraform-data}:/app/terraform
      - ./modules:/app/terraform-source/modules
      - ~/.aws:/root/.aws
    restart: unless-stopped
    networks:
      - dogstac-network

  frontend:
    build:
      context: ./webui/frontend
      dockerfile: Dockerfile
    image: dogstac/webui:latest
    container_name: dogstac-frontend
    ports:
      - "${WEBUI_PORT:-7620}:${WEBUI_PORT:-7620}"
    environment:
      - WEBUI_PORT=${WEBUI_PORT:-7620}
      - TFRUNNER_PORT=${TFRUNNER_PORT:-7621}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dogstac-network

networks:
  dogstac-network:
    driver: bridge
